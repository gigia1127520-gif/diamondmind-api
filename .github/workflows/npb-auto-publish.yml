name: DiamondMind NPB Auto Publish

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 00:03-10:58 UTC = Taiwan 08:03-18:58.
    # The API itself publishes only after entering the earliest-game final hour.
    - cron: "3-58/5 0-10 * * *"

permissions:
  contents: read

concurrency:
  group: diamondmind-npb-auto-publish
  cancel-in-progress: true

jobs:
  check-npb-auto-publish:
    name: 日棒開賽前一小時自動發布檢查
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Publish eligible NPB free and Pro picks only when due
        shell: bash
        env:
          DIAMONDMIND_CRON_SECRET: ${{ secrets.DIAMONDMIND_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DIAMONDMIND_CRON_SECRET"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 240 \
            --request POST \
            --header "X-DiamondMind-Cron: $DIAMONDMIND_CRON_SECRET" \
            "https://diamondmind-api.onrender.com/api/v1/jobs/npb-auto-publish"
