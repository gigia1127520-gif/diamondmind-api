name: DiamondMind 結算與健康監控

on:
  workflow_dispatch:
  schedule:
    # 每 20 分鐘執行；刻意避開整點，降低 GitHub 排程壅塞機率。
    - cron: "7,27,47 * * * *"

permissions:
  contents: read

concurrency:
  group: diamondmind-operations
  cancel-in-progress: false

jobs:
  monitor-and-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 喚醒並檢查 DiamondMind API
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 4 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 180 \
            "https://diamondmind-api.onrender.com/api/v1/health"

      - name: 結算所有待處理推薦
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.DIAMONDMIND_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo "缺少 DIAMONDMIND_CRON_SECRET"; exit 1; }
          response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            --request POST \
            --header "X-DiamondMind-Cron: $CRON_SECRET" \
            "https://diamondmind-api.onrender.com/api/v1/jobs/settlement")
          echo "$response"
          echo "$response" | grep -q '"ok":true' || {
            echo "結算端點未回傳 ok=true"
            exit 1
          }
