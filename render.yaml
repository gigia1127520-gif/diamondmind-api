services:
  - type: web
    name: diamondmind-api
    runtime: python
    plan: starter
    buildCommand: python -m zipfile -e diamondmind_backend.zip backend && pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: STALE_TTL_SECONDS
        value: "1800"
      - key: MIN_CONFIDENCE
        value: "56"
      - key: CORS_ORIGINS
        value: https://gigia1127520-gif.github.io
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_BOOKMAKERS
        value: draftkings,fanduel,betmgm,caesars
      - key: ODDS_MARKETS
        value: h2h,spreads,totals
      - key: ODDS_CACHE_TTL_SECONDS
        value: "900"
      - key: ODDS_STALE_TTL_SECONDS
        value: "3600"
      - key: CRON_SECRET
        sync: false
